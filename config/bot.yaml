# ============================================================
# PENGATURAN BOT PENYAPU ORDER SHEET
# ============================================================
# Bot ini menarik semua order sheet dari folder Drive tiap 12 jam,
# membuat draf dokumen untuk PO yang ATO-nya sudah terisi, dan
# memberi tahu kalau ada PO lama yang angkanya atau rumusnya berubah.

# ---- FOLDER ORDER SHEET DI GOOGLE DRIVE --------------------
# Ambil ID-nya dari alamat folder di browser:
#   https://drive.google.com/drive/folders/<INI_ID_NYA>
folder_order_sheet:
  - nama: "Order Sheet 2026"
    id: "1RDH_C3ygjlTwgrxyiTlGtsp3zjTccNTB"
  - nama: "Order Sheet 2025"
    id: "1PiXCgbeXMHDOo6Doj5XUPnzmfl9A1S57"

# ---- KE MANA LAPORAN DITARUH -------------------------------
# ID folder Drive tempat bot menaruh laporan sapuan.
# Kosongkan kalau belum ada; laporan tetap tersimpan di komputer.
folder_laporan_id: ""

# Nama folder laporan yang dibuat bot di dalam folder di atas.
nama_folder_laporan: "LAPORAN BOT ORDER SHEET"

# ---- SHEET OTOMATISASI -------------------------------------
# Sheet tempat draf dokumen ditulis (OTOMATISASI_HAPPY_PUMPKIN_SINKRON).
sheet_otomatisasi_id: "1qkd-_wc3LoGcU7kQ8oJi70bGOMjLpvrPVBXzHeQa4Vw"

# ---- APA YANG DIKERJAKAN BOT -------------------------------
buat_draf_dokumen: true      # buat Surat Jalan/Invoice/Packing List/Faktur Pajak
pantau_perubahan: true       # deteksi perubahan pada PO lama
pantau_rumus: true           # ikut membandingkan rumus, bukan cuma angkanya

# ---- SEBERAPA HEMAT BOT MEMBACA ----------------------------
# Bot TIDAK mengunduh spreadsheet. Ia membaca tab langsung lewat Sheets API.
#
# true  -> spreadsheet yang tidak berubah sejak sapuan terakhir dilewati
#          sama sekali. Waktu ubahnya dibaca dari Google Drive, jadi order
#          sheet lama yang sudah selesai tidak ditarik berulang tiap hari.
# false -> semua spreadsheet dibaca ulang tiap sapuan (lebih lambat,
#          hanya perlu kalau catatan kondisi rusak atau mau memaksa).
lewati_yang_tidak_berubah: true

# Hanya order sheet yang diubah dalam sekian hari terakhir yang diperiksa.
# Isi 0 untuk memeriksa semuanya.
hanya_yang_berubah_hari: 0

# ---- BERKAS ------------------------------------------------
berkas_kredensial: "config/kredensial_bot.json"
berkas_kondisi: "data/kondisi_sapu.json"
